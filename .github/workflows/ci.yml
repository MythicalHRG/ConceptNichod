name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**", "hardening/**"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENCRYPTION_SECRET_KEY: ci-only-not-for-production-32-character-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply non-breaking dependency security fixes
        run: |
          npm audit fix
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore: apply compatible dependency security fixes"
            git push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          fi
      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Unit and regression tests
        run: npm test
        env:
          NODE_ENV: test
      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production
