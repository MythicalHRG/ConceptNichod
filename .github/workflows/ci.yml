name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**", "hardening/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENCRYPTION_SECRET_KEY: ci-only-not-for-production-32-character-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate compatible dependency updates
        run: npm audit fix --package-lock-only || true
      - name: Upload updated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: audited-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Unit and regression tests
        run: npm test
        env:
          NODE_ENV: test
      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production
      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high
