name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**", "hardening/**"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENCRYPTION_SECRET_KEY: ci-only-not-for-production-32-character-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and resolve dependencies
        run: npm install --no-audit --no-fund
      - name: Apply non-breaking dependency security updates
        run: npm audit fix --no-fund
      - name: Upload resolved lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: audited-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Unit and regression tests
        run: npm test
        env:
          NODE_ENV: test
      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production
      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit resolved security lockfile
        if: success() && github.event_name == 'push'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'No dependency lockfile changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(deps): apply non-breaking security updates'
          git push origin HEAD:${GITHUB_REF_NAME}
